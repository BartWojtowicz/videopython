name: CI Pipeline
on:
  # Restricted to main: any other branch that has an open PR is already covered by
  # the `pull_request` trigger below, and an unrestricted `push` would run the whole
  # matrix twice for every same-repo PR.
  push:
    branches: [main]
  # Required for PRs from forks. Fork branches live in the contributor's repo, so a
  # push there fires no event here and the PR gets no checks at all.
  pull_request:
  workflow_call:

# One in-flight run per branch. Without this, force-pushing to a PR leaves the
# previous full matrix running to completion. `main` is keyed by run_id so pushes
# there never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["311", "312", "313", "314"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg -y
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev
      - name: Run tests
        run: uv run pytest --cov=src/videopython/base --cov=src/videopython/audio --cov=src/videopython/editing --cov-report=term --cov-report=term-missing

  static_checks:
    name: Static checks (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 312
      - name: Install dependencies for hooks
        run: uv sync --dev
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  platform_smoke:
    name: Wheel smoke - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu
            runner: ubuntu-latest
            python: .wheel-smoke/bin/python
          - os: macOS
            runner: macos-latest
            python: .wheel-smoke/bin/python
          - os: Windows
            runner: windows-latest
            python: .wheel-smoke/Scripts/python.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg -y
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Set up Python
        run: uv python install 314
      - name: Build and install the wheel in a clean environment
        shell: bash
        run: |
          uv build --wheel
          uv venv --python 3.14 .wheel-smoke
          wheel=$(find dist -name '*.whl' -print -quit)
          uv pip install --python "${{ matrix.python }}" "$wheel"
          uv pip install --python "${{ matrix.python }}" "mcp>=1.27,<2"
      - name: Smoke-test public imports, rendering, and MCP
        shell: bash
        run: "${{ matrix.python }} .github/smoke_wheel.py"

  pip_resolve:
    # The consumer-install guard. Lives in its own workflow so it can also run on
    # a schedule without dragging the whole matrix along; see pip-resolve.yml.
    name: Wheel resolves with pip
    uses: ./.github/workflows/pip-resolve.yml

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 312
      - name: Install dependencies
        run: uv sync --group dev
      - name: Build documentation
        run: uv run mkdocs build --strict

  version_check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if version files changed
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(RELEASE_NOTES\.md|pyproject\.toml)$'; then
            echo "check=true" >> $GITHUB_OUTPUT
          else
            echo "check=false" >> $GITHUB_OUTPUT
          fi
      - name: Validate version consistency
        if: steps.changed.outputs.check == 'true'
        run: |
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          RELEASE_VERSION=$(grep -m1 '^## [0-9]' RELEASE_NOTES.md | sed 's/## //')

          if [ "$PYPROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Version mismatch! pyproject.toml has '$PYPROJECT_VERSION' but RELEASE_NOTES.md has '$RELEASE_VERSION'"
            exit 1
          fi
          echo "Versions match: $PYPROJECT_VERSION"
