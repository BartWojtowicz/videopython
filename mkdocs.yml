site_name: videopython
site_url: https://videopython.com
site_description: Minimal video generation and processing library for Python
repo_url: https://github.com/bartwojtowicz/videopython
repo_name: bartwojtowicz/videopython

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # Keep the pre-Diátaxis URLs alive; the site is published and linked from PyPI.
  - redirects:
      redirect_maps:
        getting-started/installation.md: install.md
        getting-started/quickstart.md: tutorials/first-edit.md
        guides/llm-integration.md: how-to/llm-plans.md
        guides/auto-editing.md: how-to/auto-editing.md
        guides/mcp.md: how-to/mcp-server.md
        examples/social-clip.md: how-to/social-clip.md
        examples/ai-video.md: how-to/ai-generated-video.md
        examples/auto-subtitles.md: tutorials/subtitles.md
        examples/large-videos.md: how-to/long-videos.md
        api/index.md: reference/index.md
        api/core/video.md: reference/video.md
        api/core/audio.md: reference/audio.md
        api/editing.md: reference/video-edit.md
        api/operations.md: reference/operations.md
        api/transforms.md: reference/transforms.md
        api/effects.md: reference/effects.md
        api/text.md: reference/transcription.md
        api/ai/generation.md: reference/ai/generation.md
        api/ai/understanding.md: reference/ai/understanding.md
        api/ai/video_analysis.md: reference/ai/video-analysis.md
        api/ai/auto_edit.md: reference/ai/auto-edit.md
        api/ai/dubbing.md: reference/ai/dubbing.md
        api/ai/transforms.md: reference/ai/operations.md
        api/ai/effects.md: reference/ai/operations.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            members_order: source
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Diátaxis: tutorials teach, how-to guides solve a task, reference describes,
# explanation gives background. Keep new pages inside one of those four modes.
nav:
  - Home: index.md
  - Install: install.md
  - Tutorials:
      - tutorials/index.md
      - 1. Your first edit: tutorials/first-edit.md
      - 2. Subtitle a video with AI: tutorials/subtitles.md
  - How-to guides:
      - how-to/index.md
      - Build a vertical social clip: how-to/social-clip.md
      - Process hour-long videos: how-to/long-videos.md
      - Assemble a video from AI-generated media: how-to/ai-generated-video.md
      - Dub a video into another language: how-to/dubbing.md
      - Author edit plans with your own LLM: how-to/llm-plans.md
      - Let a local LLM edit for you: how-to/auto-editing.md
      - Drive editing from an MCP agent: how-to/mcp-server.md
  - Reference:
      - reference/index.md
      - Video: reference/video.md
      - Audio: reference/audio.md
      - Transcription & subtitles: reference/transcription.md
      - Edit plans: reference/video-edit.md
      - Operations: reference/operations.md
      - Transforms: reference/transforms.md
      - Effects: reference/effects.md
      - AI:
          - Generation: reference/ai/generation.md
          - Understanding: reference/ai/understanding.md
          - Video analysis: reference/ai/video-analysis.md
          - Auto-editing: reference/ai/auto-edit.md
          - Dubbing: reference/ai/dubbing.md
          - AI operations: reference/ai/operations.md
      - MCP server: reference/mcp.md
  - Explanation:
      - explanation/index.md
      - Architecture: explanation/architecture.md
      - The streaming engine: explanation/streaming-engine.md
      - The plan lifecycle: explanation/plan-lifecycle.md
      - LLM-first design: explanation/llm-first-design.md
      - Local-only AI: explanation/local-ai.md
  - Glossary: glossary.md
